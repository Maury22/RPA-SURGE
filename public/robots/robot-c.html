<script>
    let total = 0;
    // Sonido de alerta generado con Web Audio (sin archivos externos)
    function beep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [880, 660, 880, 660].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq;
                const t = ctx.currentTime + i * 0.22;
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
                osc.connect(gain).connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.21);
            });
        } catch (e) {}
    }
    window.alertApi.onError((texto) => {
        total++;
        document.getElementById('msg').textContent = texto;
        const c = document.getElementById('count');
        if (total > 1) { c.style.display = 'block'; c.textContent = total + ' errores'; }
        beep();
    });
</script>
